# 配置电影的分类策略， 配置为空或者不配置该项则不启用电影分类
movie:
  # 【顺序即优先级】分类名同时也是目录名，自上而下匹配，第一个命中的立刻返回，越"窄"的越要靠前
  # 儿童电影 —— 电影端 TMDB 只有 Family(10751)，没有 Kids（10762 是剧集端的）。
  # ⚠️ 必须排最前：儿童动画电影同时带 16(动画) 与 10751，慢一步就会被下面的规则抢走。
  儿童电影:
    genre_ids: '10751'
  # 动漫电影 —— 动画(16)。⚠️ 排在「儿童电影」之后：儿童动画电影归「儿童电影」，
  #   其余动画电影（含国漫电影、日漫电影）统一归这里，不再按语种散进华语 / 外语。
  动漫电影:
    genre_ids: '16'
  # ★ 音乐(10402) 也不单独成档：按语种落「华语电影」/「外语电影」，不再留看不见的桶。
  # 华语电影 —— zh/cn/bo/za 是 TMDB 的中文语种写法，含中国香港 / 中国台湾
  华语电影:
    original_language: 'zh,cn,bo,za'
  # 外语电影 —— 兜底：不能配任何条件（空条件项 = 收下前面全部没命中的），必须放最后
  外语电影:

# 配置电视剧的分类策略， 配置为空或者不配置该项则不启用电视剧分类
# ★ 动漫与被识别为 ANIME 的剧集（genre 含 16）共用本段 —— 策略文件里不写 anime 段时
#   自动沿用 tv 段，于是动漫都会命中「儿童电视剧」或「动漫剧集」这一档，
#   不再按产地散进国产剧 / 外语电视剧。
tv:
  # 儿童电视剧 —— 剧集端有专门的 Kids(10762)。⚠️ 必须排最前（儿童优先）：
  #   儿童动漫同时带 16(动画) 与 10762(Kids)，排到「动漫剧集」后面就会被它抢走。
  # ⚠️ 不要用 10751：剧集端的 10751 是 Family，含义宽得多，成人向家庭剧也会命中。
  儿童电视剧:
    genre_ids: '10762'
  # 动漫剧集 —— 动画(16)。排在「儿童电视剧」之后：儿童动漫归「儿童电视剧」，
  #   其余动漫（国漫、日漫）统一归这里，不再按产地散进国产剧 / 外语电视剧。
  动漫剧集:
    genre_ids: '16'
  # 综艺 —— 真人秀(10764) + 脱口秀(10767) 合并一档。
  #   挡在「国产剧」前面，否则综艺大多 origin_country=CN，会被当成国产剧收走。
  综艺:
    genre_ids: '10764,10767'
  # 国产剧 —— CN 中国大陆 / TW 中国台湾 / HK 中国香港
  国产剧:
    origin_country: 'CN,TW,HK'
  # 外语电视剧 —— 兜底，必须在最后
  外语电视剧:
