# ============================================================
# nas-tools 二级分类策略模板
# ------------------------------------------------------------
# 启用方式：把 config/config.yaml 的
#       media:
#         category: default-category
#   改成
#       media:
#         category: my-category
#   然后重启容器（分类策略在启动时加载，与「自定义识别词」不同，改完必须重启）。
#
# 设计目标：
#   1. 分类根（L0）与 TMDB 的 media_type 严格对齐 —— 只有 movie / tv 两个物理根
#   2. 「儿童」单独可见：电影端与剧集端同名，且不配 anime_path 时物理上合流到同一目录
#   3. 综艺 / 纪录片显式归拢到一个「其他」分类，不污染正经分类
#   4. 动漫独立成目录，但不额外占一个物理根
#
# 三条铁律（配错是静默的：不报错，只是分错，排查成本很高）：
#   A. 顺序敏感，命中即停 —— 规则自上而下匹配，第一个命中的立即返回，越"窄"的越要靠前
#   B. 空 value 项 = 兜底（源码 app/media/category.py: if not item: return key），必须放最后
#   C. genre_ids 在电影端与剧集端是两套编号：
#      儿童电影 10751（电影端无 Kids，只有 Family）/ 儿童电视剧 10762，
#      只有 16（动画）两端同号
# ============================================================


# ------------------------------------------------------------
# 电影：只服务 movie_path。注意【动画电影也在这里】，不在 anime 段
# ------------------------------------------------------------
movie:
  # ① 儿童电影 —— Family(10751)。
  #    电影端 TMDB 没有 Kids(10762)，只能用 Family，会误收少量成人向家庭片，
  #    这是上游题材表的固有精度差异，不是配置错误。
  #    ⚠️ 必须排最前：儿童动画电影同时带 16 和 10751，慢一步就被 ② 抢走。
  儿童电影:
    genre_ids: '10751'

  # ② 动漫电影 —— Animation(16)
  动漫电影:
    genre_ids: '16'

  # ③ 其他 —— 纪录片(99) / 音乐(10402) 这类不单独归类的，显式接走。
  #    挡在 ④ 前面：否则华语纪录片会被 original_language 的 ④ 吃掉。
  #    这一桶在媒体服务器侧不建库 ⇒ app 里看不见 ⇒ 达到"不要"的效果。
  其他电影:
    genre_ids: '99,10402'

  # ④ 华语电影（zh/cn/bo/za 是 TMDB 的中文语种写法，含港澳台）
  华语电影:
    original_language: 'zh,cn,bo,za'

  # ⑤ 外语电影 —— 兜底，不能有任何条件，必须在最后
  外语电影:


# ------------------------------------------------------------
# 剧集：只服务 tv_path（被识别为 TV 的剧集）
# ------------------------------------------------------------
tv:
  # ① 儿童电视剧 —— Kids(10762)。
  #    ⚠️ 别用 10751：剧集端 10751 是 Family，含义更宽，成人向家庭剧也会命中。
  儿童电视剧:
    genre_ids: '10762'

  # ② 其他剧集 —— 综艺(10764 真人秀 / 10767 脱口秀) + 纪录片(99)。
  #    挡在 ③ 前面：综艺大多 origin_country = CN，慢一步就被「国产剧」收走。
  其他剧集:
    genre_ids: '10764,10767,99'

  # ③ 国产剧 —— 含港澳台（CN 中国大陆 / TW 中国台湾 / HK 中国香港）
  国产剧:
    origin_country: 'CN,TW,HK'

  # ④ 外语电视剧 —— 兜底，必须在最后
  外语电视剧:


# ------------------------------------------------------------
# 动漫：只服务被识别为 ANIME 的剧集（genre 含 16 的 TV）
#
# ⚠️ 动漫电影不在这里！动画电影走 movie 段（见 ② 动漫电影）。
# ⚠️ 本段的目录名若与 tv 段重名，且没有配 anime_path，
#    两段会落到同一个 tv_path 下 ⇒ 同名目录自动合流。
#    这正是「儿童动漫剧」能被并进「儿童电视剧」的原理。
# ------------------------------------------------------------
anime:
  # ① 儿童电视剧 —— 与 tv 段同名 ⇒ 合流到 tv_path/儿童电视剧/
  #    汪汪队、小猪佩奇这类，和真人儿童剧待在一起
  儿童电视剧:
    genre_ids: '10762'

  # ② 动漫电视剧 —— 兜底（进这一段的必然带 genre 16，无需再显式匹配）
  动漫电视剧:


# ============================================================
# 落盘结果（不配 anime_path，共 2 个物理根）
# ------------------------------------------------------------
#   movie_path/
#   ├── 儿童电影/
#   ├── 动漫电影/
#   ├── 其他电影/        ← 不建库，app 不可见
#   ├── 华语电影/
#   └── 外语电影/
#
#   tv_path/
#   ├── 儿童电视剧/      ← 真人儿童剧 + 儿童动漫剧 合流
#   ├── 动漫电视剧/
#   ├── 其他剧集/        ← 不建库，app 不可见
#   ├── 国产剧/
#   └── 外语电视剧/
#
# 另有系统旁路（不受本文件管辖）：
#   unknown_path/    识别失败的文件（见 config.yaml 的 media.unknown_path）
#   movie_path/精选/  在 Emby 里点过星标的片子（查重优先级高于普通分类）
#
# ============================================================
# 媒体服务器建库对照（每个分类一个库，互不重叠、不重复扫描）
# ------------------------------------------------------------
#   入口          库类型     指向的路径
#   ----------    --------   ----------------------
#   儿童电影      Movies     movie_path/儿童电影
#   动漫电影      Movies     movie_path/动漫电影
#   华语电影      Movies     movie_path/华语电影
#   外语电影      Movies     movie_path/外语电影
#   儿童电视剧    TV Shows   tv_path/儿童电视剧
#   动漫          TV Shows   tv_path/动漫电视剧
#   国产剧        TV Shows   tv_path/国产剧
#   外语电视剧    TV Shows   tv_path/外语电视剧
#
#   Emby / Jellyfin 的一个库支持添加多个文件夹，可把「华语电影 + 外语电影」
#   并进一个「电影」库，其余同理；只支持单路径的就一库一路径。
#
#   ★ 把「剧集」库只指向 国产剧 + 外语电视剧（不指 tv_path 根），
#     「动漫电视剧」就不在它的扫描范围内 ⇒ 动漫可以单独建库且不重复扫描，
#     同时因为没配 anime_path，儿童动漫剧仍留在「儿童电视剧」里。
#
#   自检法：物理上有 n 个分类目录，就应该有 n 个库指向它（或被某个库的
#   多路径覆盖）。对不上的目录名 = 没被任何库扫到 = 漏网的。
#
# ============================================================
# 可选：动漫想要独立的物理根
# ------------------------------------------------------------
#   在 config.yaml 的 media 段加一行：
#       anime_path: /your/path/anime
#   并把上面的 anime 段换成：
#
#   anime:
#     儿童动漫:
#       genre_ids: '10762'
#     国漫:
#       origin_country: 'CN,TW,HK'
#     动漫:
#
#   代价（二选一，不可兼得）：
#     · 儿童动漫剧会跟着跑进 anime_path ⇒ 儿童被拆到两个根，
#       「儿童电视剧」不再合流
#     · 换来的是「动漫」库不依赖多路径建库技巧就能干净独立
# ============================================================
