name: NAStool Debian Docker

on:
  workflow_dispatch:
  push:
    paths:
      - version.py

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Debian Docker Image
    permissions:
      contents: read
      packages: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: extract_version
        run: |
          app_version=$(cat version.py | sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
          echo "app_version=${app_version}" >> $GITHUB_ENV

      - name: Get repository owner
        id: get_owner
        run: |
          repo_owner=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          echo "repo_owner=${repo_owner}" >> $GITHUB_ENV
          echo "Repository owner: ${repo_owner}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.app_version }}-debian
            type=raw,value=debian
          labels: |
            org.opencontainers.image.title=NAStool
            org.opencontainers.image.description=NAS Media Management Tool
            org.opencontainers.image.version=${{ env.app_version }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/debian.Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image tags
        run: |
          echo "Verifying pushed image tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Test image availability
        run: |
          echo "Testing image pull from registry..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:debian
          echo "Image pull successful"
